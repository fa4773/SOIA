set default="0"
set timeout=5

# SOIA GRUB Visual Style
set menu_color_normal=light-gray/black
set menu_color_highlight=yellow/black

function load_video {
  insmod efi_gop
  insmod efi_uga
  insmod video_bochs
  insmod video_cirrus
  insmod all_video
}

load_video
set gfxpayload=keep
insmod gzio
insmod part_gpt
insmod part_msdos
insmod iso9660
insmod ext2

# Individua automaticamente il volume contenente /live/vmlinuz
search --no-floppy --set=root --file /live/vmlinuz

# Entry 1: Live RAM pura (Nessuna traccia)
menuentry "Avvia SOIA Live (RAM - Nessuna Traccia)" --class debian --class gnu-linux --class gnu --class os {
    search --no-floppy --set=root --file /live/vmlinuz
    linux /live/vmlinuz boot=live components quiet splash noeject toram
    initrd /live/initrd.img
}

# Entry 2: Live con Persistenza Crittografata o Partizionata (Stile Tails)
menuentry "Avvia SOIA Live con Persistenza" --class debian --class gnu-linux --class gnu --class os {
    search --no-floppy --set=root --file /live/vmlinuz
    linux /live/vmlinuz boot=live components persistence persistence-encryption=none,luks quiet splash
    initrd /live/initrd.img
}

# Entry 3: Installa SOIA su Disco Fisso o Chiavetta USB
menuentry "Installa SOIA su Disco o USB (Setup Guidato)" --class debian --class gnu-linux --class gnu --class os {
    search --no-floppy --set=root --file /live/vmlinuz
    linux /live/vmlinuz boot=live components soia_installer=true quiet splash
    initrd /live/initrd.img
}

# Entry 4: Modalità Ripristino & Diagnostica Hardware
menuentry "Modalità Ripristino & Shell di Emergenza (Safe Graphics)" --class debian --class gnu-linux --class gnu --class os {
    search --no-floppy --set=root --file /live/vmlinuz
    linux /live/vmlinuz boot=live components nomodeset single
    initrd /live/initrd.img
}
