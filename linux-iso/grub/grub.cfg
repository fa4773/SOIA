set default="0"
set timeout=5

# SOIA GRUB Visual Style
set menu_color_normal=light-gray/black
set menu_color_highlight=yellow/black

function load_video {
  insmod efi_gop
  insmod efi_uga
  insmod video_bochs
  insmod video_cirrus
  insmod all_video
}

load_video
set gfxpayload=keep
insmod gzio
insmod part_gpt
insmod part_msdos
insmod iso9660
insmod fat
insmod exfat
insmod ntfs
insmod ext2

# Individua automaticamente il volume contenente /live/vmlinuz
search --no-floppy --set=root --file /live/vmlinuz

# Entry 1: Avvio Live standard (veloce, compatibile, con log visibili)
menuentry "Avvia SOIA Live" --class debian --class gnu-linux --class gnu --class os {
    search --no-floppy --set=root --file /live/vmlinuz
    linux /live/vmlinuz boot=live components live-config.username=soia noeject
    initrd /live/initrd.img
}

# Entry 2: Live Safe Graphics (per GPU NVIDIA o problemi video UEFI)
menuentry "Avvia SOIA Live (Safe Graphics / NVIDIA)" --class debian --class gnu-linux --class gnu --class os {
    search --no-floppy --set=root --file /live/vmlinuz
    linux /live/vmlinuz boot=live components live-config.username=soia noeject nomodeset
    initrd /live/initrd.img
}

# Entry 3: Live RAM pura (Nessuna traccia - richiede >= 4GB RAM)
menuentry "Avvia SOIA Live in RAM (Nessuna Traccia)" --class debian --class gnu-linux --class gnu --class os {
    search --no-floppy --set=root --file /live/vmlinuz
    linux /live/vmlinuz boot=live components live-config.username=soia noeject toram
    initrd /live/initrd.img
}

# Entry 4: Live con Persistenza Crittografata o Partizionata (Stile Tails)
menuentry "Avvia SOIA Live con Persistenza" --class debian --class gnu-linux --class gnu --class os {
    search --no-floppy --set=root --file /live/vmlinuz
    linux /live/vmlinuz boot=live components live-config.username=soia persistence persistence-encryption=none,luks
    initrd /live/initrd.img
}

# Entry 5: Installa SOIA su Disco Fisso o Chiavetta USB
menuentry "Installa SOIA su Disco o USB (Setup Guidato)" --class debian --class gnu-linux --class gnu --class os {
    search --no-floppy --set=root --file /live/vmlinuz
    linux /live/vmlinuz boot=live components live-config.username=soia soia_installer=true
    initrd /live/initrd.img
}

# Entry 6: Modalità Ripristino & Shell di Emergenza
menuentry "Modalità Ripristino & Shell di Emergenza" --class debian --class gnu-linux --class gnu --class os {
    search --no-floppy --set=root --file /live/vmlinuz
    linux /live/vmlinuz boot=live components nomodeset single
    initrd /live/initrd.img
}
