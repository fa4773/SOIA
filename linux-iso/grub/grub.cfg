set default="0"
set timeout=5

# SOIA GRUB Visual Style
set menu_color_normal=light-gray/black
set menu_color_highlight=yellow/black

function load_video {
  insmod efi_gop
  insmod efi_uga
  insmod video_bochs
  insmod video_cirrus
  insmod all_video
}

load_video
set gfxpayload=keep
insmod gzio
insmod part_gpt
insmod ext2

# Entry 1: Pure RAM Live (No trace)
menuentry "Boot SOIA Live (RAM - No Trace)" --class debian --class gnu-linux --class gnu --class os {
    linux /live/vmlinuz boot=live components quiet splash noeject toram findiso=${iso_path}
    initrd /live/initrd.img
}

# Entry 2: Live with Encrypted or Partitioned Persistence (Tails Style)
menuentry "Boot SOIA Live with Persistence" --class debian --class gnu-linux --class gnu --class os {
    linux /live/vmlinuz boot=live components persistence persistence-encryption=none,luks quiet splash findiso=${iso_path}
    initrd /live/initrd.img
}

# Entry 3: Install SOIA to Hard Drive or USB Flash Drive
menuentry "Install SOIA to Disk or USB (Guided Setup)" --class debian --class gnu-linux --class gnu --class os {
    linux /live/vmlinuz boot=live components soia_installer=true quiet splash findiso=${iso_path}
    initrd /live/initrd.img
}

# Entry 4: Recovery Mode & Hardware Diagnostics
menuentry "Recovery Mode & Emergency Shell (Safe Graphics)" --class debian --class gnu-linux --class gnu --class os {
    linux /live/vmlinuz boot=live components nomodeset single
    initrd /live/initrd.img
}
